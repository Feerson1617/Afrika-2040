name: Release checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Release checks (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: 'true'
      AFRIKA_EVIDENCE_DIR: release-results/evidence
      PLAYWRIGHT_JSON_OUTPUT_FILE: release-results/browser.json
    steps:
      - name: Checkout exact PR head (no write credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Record tested source
        run: |
          mkdir -p release-results
          git rev-parse HEAD | tee release-results/commit.txt
          node --version | tee release-results/node.txt
      - name: Install locked dependencies
        run: npm ci 2>&1 | tee release-results/npm-ci.txt
      - name: All logic tests
        run: npm test 2>&1 | tee release-results/logic.txt
      - name: TypeScript and production build
        run: npm run build 2>&1 | tee release-results/build.txt
      - name: Audit only deployable files
        run: node scripts/check-dist.mjs | tee release-results/dist.json
      - name: Install Playwright engine and OS libraries
        run: npx playwright install --with-deps ${{ matrix.browser }} 2>&1 | tee release-results/browser-install.txt
      - name: Curriculum modules, production smoke and existing regressions
        run: npx playwright test --config=playwright.afrika.config.ts --project=${{ matrix.browser }} --reporter=list,html,json 2>&1 | tee release-results/browser.txt
      - name: Summary
        if: always()
        run: |
          printf '### Release checks (%s)\n\nTested PR head: `%s`\n\nResult: %s. See the attached logs, HTML report and failure traces. No deployment.\n' "$ENGINE" "$(git rev-parse HEAD)" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
        env:
          ENGINE: ${{ matrix.browser }}
          RESULT: ${{ job.status }}
      - name: Test evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-checks-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            release-results/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
